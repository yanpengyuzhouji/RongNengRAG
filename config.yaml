# RAG 知识库系统配置

# ===== API 安全 =====
security:
  # 默认失败关闭：未配置 API key 时数据接口拒绝启动/访问。
  require_auth: false
  api_keys_env: "RONGNENG_API_KEYS_JSON"
  single_api_key_env: "RONGNENG_API_KEY"
  single_principal_env: "RONGNENG_API_PRINCIPAL"
  # 服务器本地路径导入默认关闭。如确需开启，必须同时设置绝对路径白名单。
  allow_local_path_import: false
  local_path_import_roots: []
  cors_origins:
    - "http://192.168.0.7:5174"
    - "http://192.168.0.7:5173"
    - "http://localhost:5174"
    - "http://localhost:5173"
    - "http://127.0.0.1:5174"
    - "http://127.0.0.1:5173"

# ===== 路径配置 =====
# 所有路径相对于项目根目录 (config.yaml 所在目录)
# 也支持绝对路径，如 "D:/xx/xx"
paths:
  knowledge_base: ""                          # 知识库文档目录，批量导入时配置
  metadata_db: "data/file_metadata.db"         # SQLite 文件注册表
  milvus_db: "data/milvus_lite.db"             # Milvus Lite 向量数据库
  parsed_cache: "data/parsed_cache"            # 解析缓存
  ceb_rendered: "data/ceb_pages"               # CEB 原生分页 PNG 派生缓存
  uploads_dir: "data/uploads"                  # 上传文件暂存
  models_dir: "data/models"                    # 本地模型文件

# ===== 知识库域配置 =====
domains:
  变电:
    path: "变电"
    categories:
      - 标准规范
      - 技术文件
      - 设计图纸
      - 设计规范
      - 通知意见
      - 会议纪要
      - 培训资料
      - 物资采购
      - 造价与费用
      - 三维设计
      - 研究技术报告
      - 设计公司文件
  配电:
    path: "配电"
    categories:
      - 标准规范
      - 技术文件
      - 通用设计典设
      - 设计规范
      - 图审要求
      - 差异化设计
      - 通知意见
      - 物料与技术规范书
      - 造价与费用
      - 培训资料
      - 管理办法
      - 设计图集
      - 专题场景
  送电输电:
    path: "送电输电"
    categories:
      - 标准规范
      - 设计规程
      - 反事故措施
      - 水土保持环保
      - 通信
      - 通知意见
  综合:
    path: "综合"
    categories:
      - 省公司发文
      - 地市公司发文
      - 公共培训资料
      - 跨域通用文件
      - 杂项

# ===== 域关键词典（查询分类用） =====
domain_keywords:
  变电: ["变电站", "变电", "变电所", "换流站", "GIS", "主变", "配电装置", "主接线",
         "电气一次", "电气二次", "继电保护", "综合自动化", "直流系统"]
  配电: ["配电", "配网", "配电网", "10kV", "20kV", "箱变", "配电室", "充电站",
         "充电桩", "台区", "低压", "光伏", "分布式", "环网柜"]
  送电输电: ["输电", "送电", "架空线路", "杆塔", "电缆线路", "电力电缆", "线路走廊", "导线",
              "地线", "OPGW", "绝缘子", "防振锤", "跨越", "耐张", "电磁环境", "电缆敷设", "架空电力线路"]
  综合: ["省公司", "市公司", "发文", "管理制度", "费用标准", "定额", "信息价"]

# ===== 标签关键词典 =====
publish_level_patterns:
  国标: ["GB[/T]?\\s*\\d", "国标", "国家标准"]
  行标: ["DL[/T]?\\s*\\d", "DLT", "行标", "行业标准"]
  企标: ["Q/GDW", "企标", "企业标准"]
  # 按实际单位调整, 以下为示例
  省级: ["省公司", "省电力"]
  地市: ["市公司", "供电公司"]

voltage_patterns:
  "10kV": ["10kV", "10千伏", "10 kv", "~10kV"]
  "20kV": ["20kV", "20千伏"]
  "35kV": ["35kV", "35千伏"]
  "66kV": ["66kV", "66千伏"]
  "110kV": ["110kV", "110千伏"]
  "220kV": ["220kV", "220千伏"]
  "500kV": ["500kV", "500千伏"]
  "750kV+": ["750kV", "1000kV", "特高压"]

discipline_patterns:
  电气一次: ["电气一次", "一次", "主接线", "配电装置", "GIS", "母线", "高压"]
  电气二次: ["电气二次", "二次", "监控系统", "自动化", "测控", "信息模型"]
  土建: ["土建", "建筑", "结构", "基础", "地基", "消防", "暖通", "给排水"]
  线路: ["线路", "架空", "电缆", "杆塔", "导线", "送电", "输电"]
  保护: ["保护", "继电", "继电保护", "调度", "安稳", "安自"]
  通信: ["通信", "光缆", "光纤", "SDH", "OTN", "信息"]

equipment_patterns:
  变压器: ["变压器", "主变", "配变", "站用变", "接地变"]
  开关柜GIS: ["GIS", "开关柜", "环网柜", "充气柜", "中置柜"]
  断路器: ["断路器", "SF6", "真空断路器"]
  电缆导线: ["电缆", "导线", "架空线", "绝缘导线"]
  继电保护: ["保护装置", "继电保护", "差动保护", "距离保护", "过流保护"]
  互感器: ["互感器", "CT", "PT", "CVT", "电流互感器", "电压互感器"]
  避雷器: ["避雷器", "SPD", "过电压保护"]
  直流系统: ["直流", "蓄电池", "充电机", "UPS", "一体化电源"]
  监控系统: ["监控", "SCADA", "远动", "RTU"]
  新能源: ["光伏", "储能", "充电桩", "风电", "分布式电源"]

doc_number_patterns:
  # 公司发文编号 (示例, 按实际单位调整)
  company_doc: '[一-龥]{2,8}〔\d{4}〕\d+号'
  # 标准编号
  gb_standard: 'GB[/T]?\s*\d+[\.-]\d+'
  dl_standard: 'DL[/T]?\s*\d+[\.-]\d+'
  qgdw_standard: 'Q/GDW\s*\d+[\.-]\d+'

# ===== 绘图图号提取规则 =====
drawing_code_pattern: '(?P<voltage>\d+)-(?P<scheme>[A-Z]\d+-\d+)-(?P<discipline_code>[A-Z]\d+)-(?P<drawing_seq>\d+)'
drawing_discipline_map:
  D01: "电气一次"
  D02: "电气二次"
  D03: "电气一次"
  D04: "电气一次"
  S01: "给排水/水工"
  T01: "土建"
  T02: "结构"
  T03: "构支架基础"
  N01: "暖通"

# ===== 分块配置 =====
chunking:
  semantic:
    chunk_size: 512       # tokens (~350-400中文字符)
    chunk_overlap: 64     # tokens (~40-50中文字符)
    separators:
      - "\n\n\n"
      - "\n\n"
      - "\n"
      - "。"
      - "；"
      - "，"
      - ". "
      - " "
      - ""
  single_page:
    enabled: true
    max_pages_for_single: 1   # 1页PDF直接作为单个chunk
  full_document:
    max_chars_for_full: 1500  # <1500字符的短文档不拆分

# ===== CEB 配置 (原生 Apabi 32 位 ActiveX → 多页 PNG，不经过 PDF) =====
ceb:
  enabled: true
  renderer_script: "scripts/ceb_render_pages.ps1"
  apabi_dir: "D:\\Apabi reader"
  powershell: "powershell.exe"
  powershell32: "C:\\Windows\\SysWOW64\\WindowsPowerShell\\v1.0\\powershell.exe"
  render_width: 800
  render_height: 1000
  timeout: 300

# ===== OCR 配置 (扫描件 PDF/CEB 页面识别 — 外部 PaddleOCR-VL 服务) =====
ocr:
  enabled: true                    # 是否启用 OCR (扫描件识别)
  always_pipeline: true            # 上传解析统一走 8001 Pipeline，保留版面块；失败时回退原文
  provider: "vl"                   # 仅支持 "vl" — 外部 PaddleOCR-VL OpenAI兼容服务
  vl:
    base_url: "http://192.168.0.201:8001"   # PaddleOCR pipeline 服务地址
    protocol: "pipeline"                    # pipeline: multipart POST /ocr；openai: /v1/chat/completions
    endpoint: "/ocr"
    model: "paddleocr-pipeline"              # pipeline 由服务端选择 Layout + PaddleOCR-VL 模型
    timeout: 180                             # 单页识别超时 (秒)
    max_tokens: 1024                         # 单页识别最大生成 token (须 < 模型上下文4096)
  compare:
    enabled: true
    legacy_base_url: "http://192.168.0.201:8080"
    legacy_model: "PaddleOCR-VL-1.6-0.9B"
    legacy_protocol: "openai"
  dpi: 150                         # PDF 渲染 DPI (越大越清晰，越慢)
  max_image_dim: 3000              # 图片最大边长 (px)，超限自动缩放
  min_text_chars: 50               # 单页最少文本字符，低于此值触发 OCR

# ===== 嵌入模型配置 =====
embedding:
  # 稠密向量继续调用 OpenAI 兼容 API (当前 Qwen3-Embedding-0.6B);
  # BGE-M3 仅在本地 CPU 生成 lexical sparse weights，不替换稠密模型。
  provider: "openai"
  model_name: "BAAI/bge-m3"          # 仅 sentence_transformers provider 用
  device: "cpu"                      # 仅 sentence_transformers provider 用
  dimensions: 1024                   # 稠密向量维度 (Milvus schema 用, 须与 API 模型一致)
  batch_size: 20                     # 每次 API 调用的批量大小
  normalize: true                    # 对 API 返回的稠密向量做 L2 归一化
  max_length: 8192
  # 稀疏向量来源: bge_m3 = 本地 BGE-M3 lexical weights (CPU);
  #               none   = 纯稠密检索。BM25 另作为 corpus-aware 词法分支。
  sparse_provider: "bge_m3"
  sparse_model_name: "BAAI/bge-m3"
  sparse_device: "cpu"
  sparse_batch_size: 16
  sparse_max_length: 512
  # --- OpenAI 兼容 embedding API (provider=openai 时生效) ---
  openai:
    base_url: "https://api-inference.modelscope.cn/v1"   # 魔搭推理 API
    model: "qwen/Qwen3-Embedding-0.6B"    # 1024维, 与 schema 一致; 8B 为 4096维 (需改库)
    api_key: ""                 # 可直接填, 或用下方环境变量 (优先级更高)
    api_key_env: "MODELSCOPE_API_KEY"   # 从环境变量读取 (优先级: env > api_key)
    timeout: 60
    max_retries: 3
  # HuggingFace 镜像设置 (重排器等本地模型下载用)
  # 注意: 用绝对路径 (main.py 启动时会强制 HF_HOME 指向此目录); E 盘不存在则改到项目内 data/
  hf_home: "D:/git/RongNengRAG/data/hf_cache"     # 模型缓存目录
  # hf_endpoint: 用 huggingface.co 直连 (hf-mirror 对 resolve/main 返回 308 重定向,
  #   huggingface_hub 的 HEAD 请求不跟随导致下载失败; 本机直连 hf 可达)
  hf_endpoint: "https://huggingface.co"

# ===== 重排序器配置 =====
reranker:
  # provider: flagembedding = 本地交叉编码器精排 (CPU 可运行，首次请求下载模型)
  #           none = 关闭模型重排, 仅元数据加权排序
  provider: "flagembedding"
  model_name: "BAAI/bge-reranker-v2-m3"
  device: "cpu"
  batch_size: 8
  top_k: 15
  none_rrf_weight: 0.15              # provider=none: rank prior vs retrieval score
  max_metadata_boost: 1.20           # metadata may adjust, never dominate relevance
  metadata_boosts:
    exact_doc_number_match: 1.05      # 降低加权系数，避免过度加权
    file_name_match: 1.30             # 文件名匹配新增
    category_standard: 1.05
    publish_level_national: 1.05
    domain_match: 1.05
    voltage_level_match: 1.05
    drawing_penalty: 0.90

# ===== 检索配置 =====
retrieval:
  coarse_top_k: 50         # Stage 1: hybrid search candidates
  fine_top_k: 15           # Stage 2: after reranking
  max_chunks_per_file: 3   # allow multiple clauses per file without one file monopolising context
  rrf_k: 60                # Reciprocal Rank Fusion parameter
  dense_weight: 0.7        # Dense embedding weight in hybrid (标准规范语义更重要)
  sparse_weight: 0.3       # BGE-M3 sparse lexical weight in Milvus branch
  bm25_enabled: true       # corpus-aware BM25 branch (IDF + document-length normalization)
  bm25_weight: 0.25        # final vector/BM25 fusion weight
  nprobe: 16               # IVF index probe count
  confidence:              # 置信度校准
    min_score_threshold: 0.3
    softmax_temperature: 1.0

# ===== LLM配置 (OpenAI 兼容接口) =====
llm:
  provider: "openai"        # 仅支持 "openai" — 任意 OpenAI 兼容 /v1/chat/completions 服务
  openai:
    base_url: "http://192.168.0.201:18000/v1"   # vLLM / Xinference / PaddleX serving 等
    model: "/data/models/Qwen/Qwen3-4B"   # vLLM 注册的完整模型 id
    api_key: ""             # 本地服务通常无需 key; 云服务填入真实 key
    api_key_env: "LLM_API_KEY"   # 优先从环境变量读取 (优先级: env > api_key)
    temperature: 0.1
    max_tokens: 4096
    enable_thinking: false        # Qwen3/vLLM: 不输出 <think> 推理内容

# ===== API配置 =====
api:
  host: "0.0.0.0"
  port: 8000

# ===== 对话配置 =====
conversation:
  max_context_tokens: 32768    # 最大上下文窗口 (tokens)
  keep_detail_rounds: 3       # 保留最近N轮详细内容
  compress_threshold: 0.85    # 达到窗口85%时触发压缩

# ===== 增量更新 =====
incremental:
  watch_interval_seconds: 300    # 5 minutes between scans
  enable_auto_index: true
